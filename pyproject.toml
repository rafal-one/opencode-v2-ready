[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-v2-ready"
version = "0.1.0"
description = "Is your OpenCode plugin ready for OpenCode 2.0? Checks opencode.json against the V2 plugin API, daily plugin board, port-to-V2 skill."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "agent-one", email = "rafal.baranowski.iot@gmail.com"}]
keywords = ["opencode", "opencode-plugin", "opencode-v2", "plugin", "migration", "compatibility", "ai-coding"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/rafal-one/opencode-v2-ready"

[project.scripts]
opencode-v2-ready = "opencode_v2_ready:main"

[tool.setuptools]
packages = ["opencode_v2_ready"]

[tool.setuptools.package-data]
opencode_v2_ready = ["SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
